services:
  db:
    image: postgres:16-alpine
    container_name: zabbix-db
    ports: 
      - "5432:5432"
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  zabbix-app:
    image: zabbix-debian:v1
    container_name: zabbix-debian
    ports:
      - "80:80"
      - "10051:10051"
    environment:
      - ZBX_SERVER_HOST=127.0.0.1
      - ZBX_SERVER_PORT=10051
      - DB_SERVER_HOST=db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G